<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cookiecutter.project_name }}</title>
    <link rel="icon" type="image/gif" href="/static/icons8-favicon.gif">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        .htmx-indicator { opacity: 0; transition: opacity 200ms; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .weather-emoji { font-size: 3rem; margin: 0; }
        .weather-stats li { display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <h1>{{ cookiecutter.project_name }}</h1>

    <img src="/static/images.jpeg" alt="Example image">

    <h2>Weather — London</h2>
    <button
        hx-get="/weather"
        hx-target="#weather-placeholder"
        hx-swap="outerHTML"
        hx-indicator="#spinner"
    >
        Fetch weather
    </button>
    <span id="spinner" class="htmx-indicator"> Loading...</span>

    <div id="weather-placeholder"></div>
</body>
</html>
