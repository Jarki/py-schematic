<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cookiecutter.project_name }}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
        img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }
        button { padding: 0.5rem 1.2rem; cursor: pointer; }

        .htmx-indicator { opacity: 0; transition: opacity 200ms; }
        .htmx-request .htmx-indicator { opacity: 1; }

        #weather-card { margin-top: 1rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
        .weather-emoji { font-size: 3rem; margin: 0; }
        .weather-description { font-size: 1.2rem; font-weight: bold; margin: 0.25rem 0 1rem; }
        .weather-stats { list-style: none; padding: 0; margin: 0 0 1rem; }
        .weather-stats li { display: flex; justify-content: space-between; padding: 0.25rem 0; border-bottom: 1px solid #f0f0f0; }
        .label { color: #666; }
    </style>
</head>
<body>
    <h1>{{ cookiecutter.project_name }}</h1>

    <img src="/static/example.jpg" alt="Example image">

    <h2>Weather — London</h2>
    <button
        hx-get="/weather"
        hx-target="#weather-placeholder"
        hx-swap="outerHTML"
        hx-indicator="#spinner"
    >
        Fetch weather
    </button>
    <span id="spinner" class="htmx-indicator"> Loading...</span>

    <div id="weather-placeholder"></div>
</body>
</html>
